services:
  # ----------------------------------------------------------------------------
  # 1. Analytical Data Warehouse & Streaming Store (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres_dw:
    image: postgres:16-alpine
    container_name: etl_final_postgres_dw
    environment:
      POSTGRES_DB: ${DB_NAME:-etl_dw}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_final:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-etl_dw}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Event Streaming Broker (Apache Kafka 3.7 KRaft Mode - No Zookeeper)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: etl_final_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 3. Batch Orchestrator (Apache Airflow 3.1.8 Web UI & TaskFlow Engine)
  # ----------------------------------------------------------------------------
  airflow:
    image: etl_final_runtime:3.1.8
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etl_final_airflow
    depends_on:
      postgres_dw:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=false
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=${AIRFLOW_USER:-admin}
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_PASSWORD:-admin}
      - PYTHONPATH=/opt/project:/opt/airflow
      - DB_HOST=postgres_dw
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-etl_dw}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - PRIMARY_DATA_URL=${PRIMARY_DATA_URL:-https://www.datos.gov.co/api/views/vuyt-mqpw/rows.csv?accessType=DOWNLOAD}
      - API_BASE_URL=${API_BASE_URL:-https://www.datos.gov.co/resource/7tuu-upb2.json}
      - API_APP_TOKEN=${API_APP_TOKEN:-}
      - API_TIMEOUT_SECONDS=30
      - API_PAGE_LIMIT=2000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/project/src
      - ./gx:/opt/project/gx
      - ./sql:/opt/project/sql
      - ./data:/opt/project/data
      - ./streaming:/opt/project/streaming
      - ./docs:/opt/project/docs
    ports:
      - "8080:8080"
    command: airflow standalone
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # 4. Real-Time Streaming Dashboard (Streamlit Auto-refresh Live Visuals)
  # ----------------------------------------------------------------------------
  realtime_dashboard:
    image: etl_final_runtime:3.1.8
    container_name: etl_final_realtime_dashboard
    depends_on:
      postgres_dw:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - DB_HOST=postgres_dw
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-etl_dw}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./dashboard:/opt/project/dashboard
      - ./streaming:/opt/project/streaming
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "dashboard/app_realtime.py", "--server.port=8501", "--server.address=0.0.0.0"]
    restart: unless-stopped

volumes:
  pgdata_final:
