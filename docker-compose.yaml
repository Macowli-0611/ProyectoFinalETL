# ==============================================================================
# Final ETL Delivery - full local stack
#   postgres_dw        : PostgreSQL 16 (Data Warehouse + streaming store)
#   kafka              : Apache Kafka 3.7 (KRaft, no ZooKeeper)
#   airflow            : Apache Airflow 3.1.8 standalone (batch ETL DAG)
#   stream_consumer    : Kafka consumer (contract validation + streaming metrics)
#   realtime_dashboard : Streamlit real-time dashboard
# Producer runs on demand:  docker compose run --rm stream_producer
# All ports are bound to 127.0.0.1 (local demo only).
# ==============================================================================
x-runtime-env: &runtime-env
  DB_HOST: postgres_dw
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-etl_dw}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_TOPIC_VIOLENCIA: ${KAFKA_TOPIC_VIOLENCIA:-violencia-intrafamiliar-events}
  KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-etl_streaming_group}
  PYTHONPATH: /opt/project:/opt/airflow

services:
  postgres_dw:
    image: postgres:16-alpine
    container_name: etl_final_postgres_dw
    environment:
      POSTGRES_DB: ${DB_NAME:-etl_dw}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (copy .env.example)}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_final:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-etl_dw}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    container_name: etl_final_kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # the topic is created only by kafka_init
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Creates the topic explicitly (3 partitions, 24 h retention) and exits.
  kafka_init:
    image: apache/kafka:3.7.0
    container_name: etl_final_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
        --topic ${KAFKA_TOPIC_VIOLENCIA:-violencia-intrafamiliar-events}
        --partitions 3 --replication-factor 1 --config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics
        --entity-name ${KAFKA_TOPIC_VIOLENCIA:-violencia-intrafamiliar-events} --add-config retention.ms=86400000 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --describe
        --topic ${KAFKA_TOPIC_VIOLENCIA:-violencia-intrafamiliar-events}
    restart: "no"

  airflow:
    image: etl_final_runtime:3.1.8
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etl_final_airflow
    depends_on:
      postgres_dw:
        condition: service_healthy
    environment:
      <<: *runtime-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      # Local demo only: every visitor of 127.0.0.1:8080 is admin, so no password
      # has to be stored in the repository. Never expose this port publicly.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      PRIMARY_DATA_URL: ${PRIMARY_DATA_URL:-https://www.datos.gov.co/api/views/vuyt-mqpw/rows.csv?accessType=DOWNLOAD}
      API_BASE_URL: ${API_BASE_URL:-https://www.datos.gov.co/resource/7tuu-upb2.json}
      API_APP_TOKEN: ${API_APP_TOKEN:-}
      PRIMARY_FORCE_REFRESH: ${PRIMARY_FORCE_REFRESH:-false}
      API_TIMEOUT_SECONDS: "30"
      API_PAGE_LIMIT: "2000"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/project/src
      - ./gx:/opt/project/gx
      - ./sql:/opt/project/sql
      - ./data:/opt/project/data
      - ./docs:/opt/project/docs
    ports:
      - "127.0.0.1:8080:8080"
    command: airflow standalone
    restart: unless-stopped

  stream_consumer:
    image: etl_final_runtime:3.1.8
    container_name: etl_final_stream_consumer
    depends_on:
      postgres_dw:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
    environment: *runtime-env
    volumes:
      - ./streaming:/opt/project/streaming
    command: ["python", "streaming/consumer.py"]
    restart: unless-stopped

  # On-demand service: docker compose run --rm stream_producer --count 50 --interval 1
  stream_producer:
    image: etl_final_runtime:3.1.8
    profiles: ["producer"]
    depends_on:
      postgres_dw:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
    environment: *runtime-env
    volumes:
      - ./streaming:/opt/project/streaming
    entrypoint: ["python", "streaming/producer.py"]

  realtime_dashboard:
    image: etl_final_runtime:3.1.8
    container_name: etl_final_realtime_dashboard
    depends_on:
      postgres_dw:
        condition: service_healthy
    environment: *runtime-env
    volumes:
      - ./dashboard:/opt/project/dashboard
      - ./streaming:/opt/project/streaming
    ports:
      - "127.0.0.1:8501:8501"
    command: ["python", "-m", "streamlit", "run", "dashboard/app_realtime.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    restart: unless-stopped

volumes:
  pgdata_final:
